name: Publish Commander Lab Beta 0.1.7

# One-time distribution of source run 37959786879's fully validated package.
# No published 0.1.6 or earlier release/tag/assets are modified.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-beta-0.1.7.yml"

permissions:
  contents: write

concurrency:
  group: release-beta-0.1.7
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse to overwrite any existing Beta 0.1.7 tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view beta-0.1.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Beta 0.1.7 already published. Refusing to replace assets."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/beta-0.1.7" >/dev/null 2>&1; then
            echo "Beta 0.1.7 tag already exists. Refusing overwrite."
            exit 1
          fi

      - name: Retrieve Windows package validated in source CI
        env:
          ARTIFACT_URL: "https://sdmntpreastus2.oaiusercontent.com/files/00000000-88a0-81f6-a055-716c4549744b/raw?se=2026-10-09T16%3A44%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=ba8e6a1d-8083-5ce3-94b8-c78befea0fd5&skoid=c36a4874-d531-4a8d-99fc-7da0d9143d9c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T14%3A43%3A04Z&ske=2026-10-10T14%3A43%3A04Z&sks=b&skv=2026-02-06&sig=5B%2Brw1Llo4i02kTZo9wo3dsCOwjTO9Jlzp%2BojToUS1I%3D"
        run: |
          set -euo pipefail
          curl --location --fail --show-error --silent --retry 3 --max-time 240 "$ARTIFACT_URL" -o CommanderLab-Beta-0.1.7-Windows.zip
          test -s CommanderLab-Beta-0.1.7-Windows.zip
          mkdir release
          unzip -q CommanderLab-Beta-0.1.7-Windows.zip -d release
          test -s release/CommanderLab-Beta-0.1.7-Setup.exe
          test -s release/CommanderLab-Beta-0.1.7-Windows-Portable.zip
          test -s release/SHA256SUMS.txt
          test -s release/RELEASE_NOTES.md

      - name: Verify immutable 0.1.7 binary hashes and internal manifest
        run: |
          set -euo pipefail
          cd release
          test "$(wc -l < SHA256SUMS.txt)" -eq 2
          test "$(stat -c %s CommanderLab-Beta-0.1.7-Setup.exe)" -eq 21122471
          test "$(stat -c %s CommanderLab-Beta-0.1.7-Windows-Portable.zip)" -eq 24309902
          echo "8653ea3f11b331359fdbff796e79c2b047a9423bff6167c0bfceee41a0497622  CommanderLab-Beta-0.1.7-Setup.exe" | sha256sum -c -
          echo "45cb5b319997144782ab7da1fc949948ecbb1c86a90efb069ca81a551f9adbd1  CommanderLab-Beta-0.1.7-Windows-Portable.zip" | sha256sum -c -
          sha256sum -c SHA256SUMS.txt

      - name: Publish Beta 0.1.7 prerelease to the updater-visible repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create beta-0.1.7 \
            release/CommanderLab-Beta-0.1.7-Setup.exe \
            release/CommanderLab-Beta-0.1.7-Windows-Portable.zip \
            release/SHA256SUMS.txt \
            release/RELEASE_NOTES.md \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Commander Lab Beta 0.1.7" \
            --notes-file release/RELEASE_NOTES.md \
            --prerelease

      - name: Verify in-app updater can see the published beta assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view beta-0.1.7 --repo "$GITHUB_REPOSITORY" \
            --json tagName,isPrerelease,assets \
            --jq '[.tagName, .isPrerelease, ([.assets[].name] | sort)]'
          gh release view beta-0.1.7 --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | grep -Fx 'CommanderLab-Beta-0.1.7-Setup.exe'
          gh release view beta-0.1.7 --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | grep -Fx 'SHA256SUMS.txt'
