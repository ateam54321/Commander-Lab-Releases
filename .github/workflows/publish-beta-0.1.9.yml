name: Publish Commander Lab Beta 0.1.9
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-beta-0.1.9.yml"]
permissions:
  contents: write
concurrency:
  group: publish-beta-0.1.9
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refuse replacement of an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ! gh release view beta-0.1.9 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/beta-0.1.9" >/dev/null 2>&1
      - name: Retrieve Windows release package verified by source run 37989811824
        env:
          ARTIFACT_URL: "https://sdmntpreastus2.oaiusercontent.com/files/00000000-ad14-81f6-ae65-e942fd117434/raw?se=2026-10-09T21%3A03%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=77737b05-b11c-5540-af6b-c1c7bfe397c7&skoid=c36a4874-d531-4a8d-99fc-7da0d9143d9c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T14%3A08%3A21Z&ske=2026-10-10T14%3A08%3A21Z&sks=b&skv=2026-02-06&sig=OTAMW4lG2ha6Uhjl6Fw7dhrjPEKfCjln/3WxIY2o78I%3D"
        run: |
          set -euo pipefail
          curl --fail --location --show-error --silent --retry 3 --max-time 240 "$ARTIFACT_URL" -o package.zip
          mkdir release
          unzip -q package.zip -d release
          test -s release/CommanderLab-Beta-0.1.9-Setup.exe
          test -s release/CommanderLab-Beta-0.1.9-Windows-Portable.zip
          test -s release/SHA256SUMS.txt
          test -s release/RELEASE_NOTES.md
      - name: Verify exact tested binaries byte counts and SHA256SUMS
        run: |
          set -euo pipefail
          cd release
          test "$(stat -c %s CommanderLab-Beta-0.1.9-Setup.exe)" -eq 21146284
          test "$(stat -c %s CommanderLab-Beta-0.1.9-Windows-Portable.zip)" -eq 24337801
          echo "65b5e68d5b161da6b033746b720d0bf29a134f366920998e2e3147fcee8d7d2c  CommanderLab-Beta-0.1.9-Setup.exe" | sha256sum -c -
          echo "4efc959a10eb81c5da42de02e026aeeb941868ebeb98dba8d630cf80407584de  CommanderLab-Beta-0.1.9-Windows-Portable.zip" | sha256sum -c -
          sha256sum -c SHA256SUMS.txt
      - name: Publish updater-visible Beta 0.1.9 Windows hotfix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create beta-0.1.9 \
            release/CommanderLab-Beta-0.1.9-Setup.exe \
            release/CommanderLab-Beta-0.1.9-Windows-Portable.zip \
            release/SHA256SUMS.txt \
            release/RELEASE_NOTES.md \
            --repo "$GITHUB_REPOSITORY" --target main \
            --title "Commander Lab Beta 0.1.9 — Allocated Deck Deletion Hotfix" \
            --notes-file release/RELEASE_NOTES.md --prerelease
      - name: Verify updater can discover the published installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view beta-0.1.9 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'CommanderLab-Beta-0.1.9-Setup.exe'
          gh release view beta-0.1.9 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'SHA256SUMS.txt'
